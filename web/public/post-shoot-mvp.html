<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Made For This · Live</title>
  <link rel="stylesheet" href="/post-shoot-mvp.css?v=20260727-8">
  <link rel="stylesheet" href="/live-layout-fix.css?v=20260727-8">
</head>
<body>
  <main class="live-shell">
    <header class="live-header">
      <a href="/" aria-label="Назад">MFT</a>
      <span>LIVE FITTING</span>
      <i></i>
    </header>

    <section class="live-stage">
      <video id="camera" autoplay muted playsinline></video>
      <div id="camera-placeholder" class="empty-state">
        <span class="aperture"></span>
        <b>Увімкни камеру</b>
        <small>Тримай телефон вертикально на рівні грудей</small>
      </div>

      <div id="fit-guide" class="fit-guide" aria-hidden="true">
        <div class="scan-line"></div>
        <svg viewBox="0 0 240 420" role="presentation">
          <path class="body-line" d="M120 24c-25 0-44 20-44 45 0 22 14 40 34 45v17c-12 3-26 8-40 16-23 14-32 42-34 74l-4 70m88-160v270m0-270c12 3 26 8 40 16 23 14 32 42 34 74l4 70M70 147c12 38 13 82 9 130l-15 124m106-254c-12 38-13 82-9 130l15 124"/>
          <path class="shoulder-bracket" d="M38 179v-24h28m136 24v-24h-28M38 294v24h28m136-24v24h-28"/>
        </svg>
        <p><b>Відійди на 1.5–2 м</b><span>Голова, торс і стегна мають бути в рамці</span></p>
      </div>

      <div class="stage-top">
        <span class="live-mark"><i></i> LIVE</span>
        <span id="live-status">READY</span>
      </div>

      <div class="control-dock">
        <label class="reference-control" aria-label="Додати образ">
          <input id="reference-upload" type="file" accept="image/jpeg,image/png,image/webp">
          <span class="reference-visual">
            <img id="reference-preview" class="hidden" alt="Reference look">
            <i id="reference-placeholder">+</i>
          </span>
          <span><b>Образ</b><small id="reference-status">Додати фото</small></span>
        </label>
        <button id="camera-start" class="camera-button" type="button">Camera</button>
        <button id="camera-stop" class="camera-button hidden" type="button">Camera off</button>
        <button id="lucy-start" class="test-button" type="button" disabled>Live</button>
        <button id="lucy-stop" class="stop-button" type="button" aria-label="Зупинити">■</button>
      </div>
    </section>
  </main>
  <script type="module" src="/post-shoot-mvp.js?v=20260727-8"></script>
</body>
</html>
