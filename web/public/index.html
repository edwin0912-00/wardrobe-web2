<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARDROBE — Studio Experience A</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="progress" aria-hidden="true"></div>

<div class="loader" data-loader>
  <div class="loader__mark">WARDROBE</div>
  <div class="loader__rail"><div class="loader__bar" data-loader-bar></div></div>
  <div class="loader__pct" data-loader-pct>00</div>
  <div class="loader__note">версія A · 30 к/с · чотири відрізки</div>
</div>

<div class="mark">WARDROBE</div>

<main class="stage" data-stage data-leg="0" data-station="0">
  <!-- FRAME SPACE. Anything painted on the picture is a child of .film, which script sizes
       to the footage's aspect and which carries the parallax. Positioned in stage space
       instead, the panels missed the mirrors and drifted as the picture moved. -->
  <div class="film" data-film>
    <video data-leg="0" src="/assets/scroll-assembly-to-mirror-v1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video data-leg="1" src="/assets/scroll-mirror-to-tv-v1.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>
    <video data-leg="2" src="/assets/scroll-tv-to-laptop-v1.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>
    <video data-leg="3" src="/assets/scroll-laptop-to-browser-v1.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>

    <!-- Same interface as B: LEFT mirror asks, RIGHT mirror shows the look and the actions
         on it. The right one starts empty and data-live="0" — no second mirror until there
         is something to put in it. -->
    <aside class="glass" data-ui-ask style="--gx:10%; --gy:18%; --gw:39%; --gh:58%;"></aside>
    <aside class="glass" data-ui-show data-live="0" aria-hidden="true"
           style="--gx:52%; --gy:18%; --gw:39%; --gh:58%;"></aside>
  </div>

  <div class="grade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="copy">
    <h1 class="copy__line" data-on="0">YOUR DAY STARTS IN THE MIRROR</h1>
    <p class="copy__line" data-on="1">FROM PIECES, A PRESENCE.</p>
    <p class="copy__line" data-on="2">THE SAME LOOK, EVERY SCREEN.</p>
    <p class="copy__line" data-on="3">AND THEN IT LEAVES THE ROOM.</p>
  </div>
</main>

<div class="legs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="hud" data-readout>—</div>
<div class="gate" role="status" aria-live="polite">
  <i></i><b data-gate-text>Завантажте медіа цього кроку, щоб іти далі</b>
</div>
<div class="scroll-cue">крути</div>

<div data-track></div>

<script src="/engine.js"></script>
<script src="/ui.js"></script>
<script>
  window.journey = WardrobeJourney.create({
    inertia: 0.085,        // per-frame catch-up; lower is heavier
    screensPerLeg: 3.2,    // how much scroll each leg is given
    motionTable: '/motion.json',
    dampFrom: 0.70,
    dampMax: 0.94,
    stationAt: 0.92,
    legs: [
      { id: 0, name: 'диван → дзеркало' },
      { id: 1, name: 'дзеркало → телевізор' },
      { id: 2, name: 'телевізор → ноутбук' },
      { id: 3, name: 'ноутбук → браузер' }
    ]
  });

  window.ui = WardrobeUI.create();
</script>
</body>
</html>
