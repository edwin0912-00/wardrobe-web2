     source directory. Keep every relative asset bound here so the verified journey
     can be served at the canonical root without exposing that implementation path. -->

<body>

<a class="skip" href="/#journey">До взаємодії</a>

<div class="progress" aria-hidden="true"></div>

<div class="loader" data-loader>
  <div class="loader__mark">WARDROBE</div>
  <div class="loader__rail"><div class="loader__bar" data-loader-bar></div></div>
  <div class="loader__pct" data-loader-pct>00</div>
  <!-- Real bytes, not a guess. Filled by loader.js from Content-Length and the actual
       number of bytes read off each stream. -->
  <div class="loader__bytes" data-loader-bytes>—</div>
  <div class="loader__files" data-loader-files></div>
</div>

<div class="mark"><span>WARDROBE</span><span class="mark__build" data-build aria-label="Системний номер білду">BUILD —</span></div>

<main class="stage" id="journey" data-stage data-leg="0" data-station="0">
  <!-- No src attributes on purpose. loader.js downloads each master itself so the bar can
       count real bytes, then hands the elements blob URLs. Leaving a src here would start
       a second, unmeasured download in parallel. -->
  <!-- FRAME SPACE.
       Everything that must sit ON the picture lives inside .film, because .film is sized
       and transformed to match the video exactly. The panels were previously siblings of
       the video, positioned in percentages of the STAGE — but the video is cropped by
       object-fit, scaled, and translated by the parallax, so stage percentages are a
       different coordinate system entirely. That is why the interface missed the mirrors
       and drifted as you scrolled: the picture moved and the panels did not.
       Now they are children of the same transformed box, so a percentage means the same
       thing for the glass as it does for the glass in the footage.
       No src attributes on purpose: loader.js downloads each master itself so the bar can
       count real bytes, then hands the elements blob URLs. -->
  <div class="film" data-film data-intro-pending="1">
    <!-- THE INTRO. Silk, before any room, scrubbed by the same scroll and dissolving into
         room one. It is NOT a leg: data-leg 0..3 stay bound to the four rooms, so the copy
         lines, the mirror rectangles and ui.js are untouched by its arrival. It sits inside
         .film so it is cropped and scaled exactly like the footage it hands over to. -->
    <video data-intro data-src="assets/intro.mp4" poster="assets/intro-poster.jpg" muted playsinline preload="auto" aria-hidden="true"></video>

    <video data-leg="0" data-src="assets/seg1.mp4?v=seg1-d-20260730" muted playsinline preload="auto" aria-hidden="true"></video>
    <video data-leg="1" data-src="assets/seg2.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>
    <video data-leg="2" data-src="assets/seg3.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>
    <video data-leg="3" data-src="assets/seg4.mp4" muted playsinline preload="auto" aria-hidden="true" hidden></video>

    <!-- TWO MIRRORS, TWO JOBS: one asks, the other shows.
         Rectangles measured off this version's own final frame: left mirror x 5.0-44.0%,
         right mirror x 55.7-94.6%, both y 17.4-83.2%. Axis-aligned, no shear, because the
         camera is frontal and the mirrors are flush. The concrete pier between them is the
         divider, so the split is real architecture rather than a layout decision.

         LEFT asks — the questions, the inputs, the button that closes a step.
         RIGHT shows — the look itself, the choices taken, and the actions on the look,
         SIGNATURE among them. It starts data-live="0" and has no content at all: there is
         no second mirror until there is something to put in it. ui.js flips the flag when
         the first photograph lands.

         The gate panel that used to sit on the right rectangle is gone. Nothing blocks
         forward travel any more, so an empty aside on top of the SHOW mirror was a dead
         element in the one place it could do damage. gate.js and its CSS are untouched. -->
    <aside class="glass" data-ui-ask style="--gx:5.0%; --gy:17.4%; --gw:39.0%; --gh:65.8%;"></aside>
    <aside class="glass" data-ui-show data-live="0" aria-hidden="true"
           style="--gx:55.7%; --gy:17.4%; --gw:39.0%; --gh:65.8%;"></aside>

    <!-- The centre figure between the mirrors is gone: Edwin cut it as superfluous. The
         look belongs in the right-hand mirror, which is the panel whose whole job is
         showing the result. -->

    <!-- SCREEN SURFACES.
         These are not floating cards. TvScreenSurface clips media to the measured inner
         apertures across seg2 and seg3. LaptopScreenSurface stays empty and hidden until the owner
         supplies the real pipeline HTML; one DOM tree will then be projectively bound to
         the measured display quad and later inherit scroll. -->
    <aside class="tv-surface" data-tv-surface aria-label="Галерея результатів" aria-hidden="true" hidden>
      <div class="tv-surface__content" data-tv-gallery></div>
    </aside>
    <section class="laptop-surface" data-laptop-surface aria-label="Історія створення" aria-hidden="true" hidden>
      <div class="laptop-surface__page" data-laptop-page></div>
    </section>
  </div>

  <!-- Portrait phones cannot fit an input flow inside a 39%-wide filmed mirror. ui.js
       moves only the currently active mirror panel into this presentation plane; the
       other mirror stays spatially attached to the film (including its waiting orb). -->
  <div class="mobile-attention" data-mobile-attention hidden></div>

  <div class="grade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="copy">
    <!-- Owner-selected set, 2026-07-31. English lines in a Ukrainian interface were an open
         question in FUNCTION-MAP; this closes it. The register is deliberate: no address to
         the viewer, no promise, nothing about the product. Each line describes what is
         physically on screen during its own leg — the rail of clothes, the materials of the
         room, the mirrors, the way out — which is what keeps it film rather than marketing. -->
    <h1 class="copy__line" data-on="0">Речі чекають довше за людей</h1>
    <p class="copy__line" data-on="1">Бетон, дуб, шовк — і більше нікого</p>
    <p class="copy__line" data-on="2">Дзеркало не поспішає</p>
  </div>

</main>

<!-- LIVE grows from the right mirror into this one full-screen plane. It is an explicit
     immersive action, never a global bottom button. ui.js opens it only after a tap,
     traps focus, stops the camera on close/timeout/backgrounding, and reverses the same

  <button class="live-overlay__close" type="button" data-live-close>Закрити</button>

<script src="../ui.js?v=20260803-1"></script>
<script>
  /* The canonical orb renderer is an ES module and the rest of this page is classic
     scripts, so it is published on the global the same way every other controller here is
     reached. A dynamic import rather than a module script on purpose: the release preflight
     parses every inline script in this file as a classic one, and a static import statement
     is a syntax error there — an accurate complaint, not something to work around.

     ui.js checks for the global and leaves the canvas blank if it never arrives; a missing
     renderer must not take the waiting state down with it. */
  import('../thinking-orb.js').then(function (mod) {
    window.WardrobeThinkingOrb = { create: mod.createThinkingOrb };
    if (window.ui && window.ui.refreshOrbs) window.ui.refreshOrbs();
  }).catch(function () { /* no orb renderer; the label still says what is happening */ });
</script>
<script src="../audio.js"></script>
<script>
(function () {
  /* SCENE ONE IS DECIDED: variant D, 2026-07-29. Three earlier candidates (A/B/C) and the
   * original all lived behind a ?s1= switch for comparison — the owner picked D as final
   * ("якщо це було Д, добре... але це основна зараз") and asked for the rest archived, not
   * kept as live options. The switch is gone; A/B/C and the pre-D original are backed up
   * at ~/wardrobe-media-local/archived-2026-07-29/ (seg1-A/B/C.mp4, seg1-original.mp4),
   * not deleted. `assets/seg1.mp4` IS variant D now — the file was replaced in place so
   * nothing else in this file (the data-src below, motion.json's leg-0 table) needed to
   * change. */
  var VIDEOS = ['assets/seg1.mp4?v=seg1-d-20260730', 'assets/seg2.mp4', 'assets/seg3.mp4', 'assets/seg4.mp4'];
  var TRACKS = ['audio/t1.mp3', 'audio/t2.mp3', 'audio/t3.mp3'];

  var loaderEl = document.querySelector('[data-loader]');
  var barEl = document.querySelector('[data-loader-bar]');
  var pctEl = document.querySelector('[data-loader-pct]');
  var bytesEl = document.querySelector('[data-loader-bytes]');
  var filesEl = document.querySelector('[data-loader-files]');
  var soundBtn = document.querySelector('[data-sound]');
  var looksBtn = document.querySelector('[data-looks]');
  var howBtn = document.querySelector('[data-how]');
  /* iPhone Safari can fetch an MP4 into a Blob yet leave its video compositor black.
     Let it use the native Range-backed source instead; Chrome keeps the measured Blob
     path for instant desktop scrubbing. */
  var IOS_MEDIA = /iP(ad|hone|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  /* Same query mobile.css gates its expanded input plane on, read once here so the
     mirror-station capture window (below) can be widened for the same audience. */
  var MOBILE_PORTRAIT = typeof window.matchMedia === 'function'
    && window.matchMedia('(max-width: 767px) and (orientation: portrait)').matches;
  /* Begin the product side of the journey while the physical intro is loading.
     This is not part of the byte-progress bar: the bar remains an honest measure
     of film media only.  Health, profile state and the compact saved-look preview
     now travel in parallel, so arriving at the two mirrors does not begin a new
     cold request chain.  ui.js receives this exact promise later and must not
     construct a duplicate bridge. */
  var productBridgePromise = import('../adapters/cinematic-ui-bridge.mjs?v=20260803-1').then(function (module) {
    var bridge = module.createCinematicUiBridge();
    window.WardrobeCinematicBridge = bridge;
    return bridge;
  }).catch(function () {
    return null;
  });
  var INTRO = 'assets/intro.mp4';
  var MEDIA_STRATEGY = window.WardrobeMediaStrategy || null;
  /* The module makes this policy testable, but a partial static-file copy must never
     turn into a blank stage. The tiny in-page fallback has the same fixed policy and
     lets the existing runtime continue safely until its companion asset arrives. */
  var MEDIA_PLAN = MEDIA_STRATEGY ? MEDIA_STRATEGY.create({
    ios: IOS_MEDIA, intro: INTRO, tracks: TRACKS, videos: VIDEOS
  }) : {
    ios: IOS_MEDIA,
    critical: IOS_MEDIA ? [TRACKS[0], INTRO] : [TRACKS[0], INTRO, VIDEOS[0]],
    background: IOS_MEDIA ? [] : VIDEOS.slice(1)
  };
  var screenSurfaces = null;
  var pipelineDeck = null;
  function hasLoadedBlob(blobs, key) {
    return MEDIA_STRATEGY ? MEDIA_STRATEGY.hasBlob(blobs, key)
      : !!(blobs && Object.prototype.hasOwnProperty.call(blobs, key) && blobs[key]);
  }

  /* Start room one on iOS while the loader is still showing the textile/audio wave.
     Previously its native src was mounted only after that wave completed, so a quick
     first swipe could reach the handover before this 18.7 MB film had even started.
     The engine then correctly held the textile safety frame, but to the viewer it looked
     like a frozen site.  Giving only the first room an early Range-backed src overlaps
     its download with the opening and leaves later rooms on the existing lazy path. */
  var firstRoomVideo = document.querySelector('video[data-leg="0"]');
  if (IOS_MEDIA) {
    if (firstRoomVideo && !firstRoomVideo.src) {
      firstRoomVideo.src = firstRoomVideo.getAttribute('data-src');
      firstRoomVideo.load();
    }
  }

  /* Safari can expose metadata for a paused native MP4 yet keep its compositor plane
     dormant.  Priming only the textile intro fixed the opening frame but left the first
     room vulnerable at the handover: the scroll clock advanced while the room stayed on
     its initial/black plane.  A real gesture is the reliable moment at which iOS permits
     play(), so use that same gesture to wake every film plane, then pause it again. */
  var iosWakeRequested = false;
  function primeIOSFilm(v) {
      if (v.dataset.iosPrime === 'done' || v.dataset.iosPrime === 'pending') return false;
      if (!v.src || !v.duration || !isFinite(v.duration)) return false;
      v.dataset.iosPrime = 'pending';
      v.muted = true;
      try {
        if (v.currentTime === 0) v.currentTime = Math.min(0.001, v.duration - 0.001);
        var wake = v.play();
        if (wake && wake.then) {
          wake.then(function () {
            setTimeout(function () {
              v.pause();
              v.dataset.iosPrime = 'done';
            }, 120);
          }).catch(function () {
            delete v.dataset.iosPrime;
          });
        } else {
          v.pause();
          v.dataset.iosPrime = 'done';
        }
      } catch (err) {
        delete v.dataset.iosPrime;
      }
      return true;
  }
  function primeIOSFilmPlanes() {
    if (!IOS_MEDIA) return;
    iosWakeRequested = true;
    var films = Array.prototype.slice.call(document.querySelectorAll('video[data-src]'));
    films.forEach(primeIOSFilm);
  }
  if (IOS_MEDIA) {
    /* A fast first swipe can happen before a room has metadata. Remember that intent and
       wake the plane the moment its native Range request becomes seekable instead of
       silently dropping the only gesture that could have released the handover. */
    document.querySelectorAll('video[data-src]').forEach(function (v) {
      v.addEventListener('loadedmetadata', function () {
        if (iosWakeRequested) primeIOSFilm(v);
      }, { once: true });
    });
  }
  ['touchstart', 'pointerdown', 'wheel', 'keydown'].forEach(function (eventName) {
    window.addEventListener(eventName, primeIOSFilmPlanes, { passive: true });
  });

  /* iOS has ONE native owner for each room. The previous version assigned native URLs
     for seg2–seg4 as soon as the intro loader finished while loader.js was also fetching
     those very files into Blobs. With no-store media this doubled transfer pressure and
     could starve the D room at the only seam that must never stutter. Start the next
     room only after the previous one has native playback coverage and a painted frame;
     the engine holds honestly at any later seam until that certificate exists. */
  var nextIOSNativeLeg = 1;
  var iosRoomReady = Object.create(null);
  /* A visitor can deliberately jump to HOW before the ordinary sequential warm-up
     has reached the terminal clip.  Keep the one-prewarm-at-a-time guarantee, but
     let that explicit action choose the *next* native room.  Previously it only
     polled leg 3 for 15 seconds; when WebKit aborted/restarted one of the range
     requests, the click ended silently and looked broken. */
  var iosPriorityNativeLeg = null;
  function queueNextIOSRoom() {
    if (!IOS_MEDIA) return;
    if (iosPriorityNativeLeg !== null) {
      var priorityIndex = iosPriorityNativeLeg;
      iosPriorityNativeLeg = null;
      if (mountIOSRoom(priorityIndex)) return;
    }
    while (nextIOSNativeLeg < VIDEOS.length) {
      var index = nextIOSNativeLeg++;
      if (mountIOSRoom(index)) return;
    }
  }
  /* Certificate = enough native bytes to play through + a compositor-confirmed frame.
     `loadeddata` alone is intentionally not a certificate: WebKit can fire it before it
     has painted the native plane. The prewarm remains paintable until both facts arrive;
     only then is it removed and only then may the preceding seam release. */
  function certifyIOSRoom(index, room, onReady) {
    var enoughData = room.readyState >= 4;
    var painted = false;
    var finished = false;
    function finish() {
      if (finished || !enoughData || !painted) return;
      finished = true;
      iosRoomReady[index] = true;
      delete room.dataset.iosPrewarm;
      onReady();
    }
    function markPainted() {
      if (finished) return;
      painted = true;
      finish();
    }
    function requestPaintProof() {
      if (typeof room.requestVideoFrameCallback !== 'function') {
        /* Older WebKit has no compositor callback. `canplaythrough` is the strongest
           native proof it exposes; preserve the prewarm until that event instead of
           falsely treating metadata as a rendered frame. */
        markPainted();
        return;
      }
      room.requestVideoFrameCallback(function () { markPainted(); });
    }
    room.addEventListener('loadeddata', function () {
      /* Muted playsinline priming is permitted before first scroll on devices that
         allow it. If Safari declines, the real-gesture path above retries while this
         pending callback remains registered. */
      primeIOSFilm(room);
      requestPaintProof();
    }, { once: true });
    room.addEventListener('canplaythrough', function () {
      enoughData = true;
      finish();
    }, { once: true });
    room.addEventListener('error', function () {
      delete room.dataset.iosPrewarm;
      onReady();
    }, { once: true });
    if (room.readyState >= 2) {
      primeIOSFilm(room);
      requestPaintProof();
    }
    if (room.readyState >= 4) finish();
  }
  function mountIOSRoom(index) {
    var room = document.querySelector('video[data-leg="' + index + '"]');
    if (!room || room.src) return false;
    var source = room.getAttribute('data-src');
    if (!source) return false;
    /* A single invisible native prewarm plane is allowed until it has a full playback
       certificate. Safari may otherwise leave a display:none video at metadata forever;
       this attribute is removed before the next room starts, so decoder load is bounded. */
    room.dataset.iosPrewarm = '1';
    certifyIOSRoom(index, room, queueNextIOSRoom);
    room.src = source;
    room.load();
    return true;
  }

  function prioritizeIOSRoom(index) {
    if (!IOS_MEDIA) return false;
    var room = document.querySelector('video[data-leg="' + index + '"]');
    if (!room || room.src) return false;
    /* Do not create a second native prewarm.  The current certificate will release
       the queue, and the requested room becomes the next one it mounts. */
    iosPriorityNativeLeg = index;
    return true;
  }

  if (IOS_MEDIA && firstRoomVideo) {
    certifyIOSRoom(0, firstRoomVideo, queueNextIOSRoom);
  }

  function mb(n) { return (n / 1048576).toFixed(1); }

  /* Every byte of the experience, counted. Audio is in the list because it is part of
     the load — reporting only the video would be the same kind of half-truth the old
     bar told. */
  /* SOUND STARTS AT A REAL 50% OF THE OPENING LOAD.
   *
   * The score is prepared as soon as its first track lands, but playback is not requested
   * until the byte-truthful loader crosses 50%. This makes the moment deterministic on
   * desktop and mobile instead of coupling it to which file happened to finish first.
   * iOS/Safari may still refuse audible autoplay without a gesture; in that case audio.js
   * keeps the same intended audible state and unlocks on the first genuine interaction.
   * The ordinary first swipe/tap owns that retry — the sound control never asks the
   * visitor for a separate "tap to start" action. */
  var scorePrepared = false;
  var scorePlaybackRequested = false;
  var soundGestureArmed = false;

  function reflectSoundState() {
    if (!window.score || !soundBtn) return;
    var state = window.score.state();
    var active = state.activeIndex >= 0 ? state.activeIndex : 0;
    var playing = state.activeIndex >= 0 && state.paused && state.paused[active] === false;
    /* Sound is ON by default. `playing` is retained only as machine-readable state:
     * iOS can defer the initial audible call until the visitor's first ordinary swipe,
     * but we never turn that browser policy into a second required UI action. */
    soundBtn.setAttribute('aria-pressed', String(!state.muted));
    soundBtn.dataset.playback = playing ? 'playing' : (state.muted ? 'muted' : 'starting');
    soundBtn.textContent = state.muted ? 'без звуку' : 'звук';
  }

  function armSoundStateAfterGesture() {
    if (soundGestureArmed) return;
    soundGestureArmed = true;
    var events = ['pointerdown', 'keydown', 'touchstart', 'wheel'];
    var settle = function () {
      events.forEach(function (eventName) { window.removeEventListener(eventName, settle); });
      soundGestureArmed = false;
      /* iOS will reject an audible call made at loader time.  This is the first
       * ordinary swipe/tap, so retry the already-requested score inside that
       * gesture rather than asking for a separate tap on the sound control. */
      var start = scorePlaybackRequested && window.score && typeof window.score.start === 'function'
        ? window.score.start()
        : null;
      if (start && typeof start.then === 'function') {
        start.then(function () { setTimeout(reflectSoundState, 0); }, function () { setTimeout(reflectSoundState, 0); });
      } else {
        setTimeout(reflectSoundState, 0);
      }
    };
    events.forEach(function (eventName) {
      window.addEventListener(eventName, settle, { passive: true, once: true });
    });
  }

  function prepareScore(blobs, from) {
    if (scorePrepared || !blobs || !blobs[TRACKS[0]]) return;
    scorePrepared = true;
    /* The exact prepared source and threshold are visible for QA without exposing
       private media or inventing a playback result. */
    window.scorePreparedFrom = from || 'unknown';
    window.score = WardrobeAudio.create({
      tracks: TRACKS.map(function (t) { return blobs[t] || t; }),
      /* Keep the intended state audible. If autoplay is blocked, audio.js waits for
         a real gesture and starts audible on that gesture; it never unlocks muted. */
      startMuted: false,
      volume: 0.55,
      entryFadeInMs: 1400,
      /* 15% — the owner's number. Constant: the room does not get more concrete when you
         scroll faster, only the echo answers the movement. */
      reverb: 0.15,
      roomSeconds: 3.6,
      roomDecay: 1.5,
      /* No overlap: the outgoing track falls to silence, the room empties for longer than
         its own 3.6 s tail, and only then does the next rise. A negative gap used to make
         them play together — and t2/t3 are two renders of the same piece, identical in
         duration to six decimals, so that overlap was one track phasing against itself. */
      fadeOutMs: 3600,
      gapMs: 1500,
      fadeInMs: 3000,
      delaySeconds: 0.34,
      /* Echo rises on a SINE to 80% at speed and falls to nothing at rest. echoCurve is
         gone — the shape is no longer a tunable exponent, it is the sine, same as the camera. */
      echoMax: 0.80,
      feedbackMax: 0.66
    });
  }

  function requestScoreAtHalf(blobs, ratio) {
    if (ratio < 0.5) return;
    prepareScore(blobs, 'loader @ ' + Math.round(ratio * 100) + '%');
    if (!window.score || scorePlaybackRequested) return;
    scorePlaybackRequested = true;
    window.scoreStartedFrom = 'loader @ ' + Math.round(ratio * 100) + '%';
    window.score.start().then(function () {
      reflectSoundState();
      var state = window.score && window.score.state ? window.score.state() : null;
      var active = state && state.activeIndex >= 0 ? state.activeIndex : 0;
      if (!state || !state.paused || state.paused[active] !== false) armSoundStateAfterGesture();
    }).catch(function () {
      /* `start()` normally resolves false on policy rejection, but keep this honest
         fallback for an unexpected audio implementation error. */
      reflectSoundState();
      armSoundStateAfterGesture();
    });
  }

  /* THE SCORE'S FIRST TRACK LOADS ON ITS OWN, AHEAD OF EVERYTHING.
     Two cheaper attempts were measured and both failed: listing it first made it finish
     LAST (this server delivers in reverse request order, twice over), and hinting the
     fetch 'high' moved it from 98.8 percent to 100. Neither lever is binding. Its own
     wave is, so the room has music from the first seconds of the load instead of the last.
     4.9 MB before 40 MB of masters — the masters start a moment later, deliberately. */
  var FIRST_WAVE = [TRACKS[0]];

  /* THE BAR MEASURES WHAT IS REQUIRED TO BEGIN, AND NOTHING ELSE.
   *
   * It used to count all seven files — 40 MB — so the viewer waited for the fourth room
   * before seeing the first. Now the loader gates on exactly what the opening needs: the
   * score's first track and the first room's film. The other three rooms and the two later
   * tracks download afterwards, underneath a journey that has already started.
   *
   * The percentage is the raw ratio of bytes received to bytes required. No clamp, no
   * reserved tail, no minimum duration. It was briefly held at 99 until every blob had
   * been assembled, which was pinning the number to a value rather than reporting one —
   * and the thing it was hiding is a fraction of a millisecond of memory work, not
   * loading. All the bytes really have arrived at 100.
   *
   * The engine will not enter a room whose film has not landed, so starting early cannot
   * show an empty frame; it holds at the seam with data-gate="loading" instead. */
  /* The textile is still the first visible movement. Desktop keeps only its immediate
     D handoff in the initial byte-truthful load; it does not wait for TV or laptop.
     iOS starts the same D master native before this load and retains its Range delivery. */
  var REQUIRED = MEDIA_PLAN.critical;
  /* Films only. The two later tracks are NOT listed here: the score's own <audio> elements
     are given those URLs directly and fetch them natively, so putting them in this list
     too would download 9.8 MB twice. */
  /* On desktop D is part of the truthful initial load, so the fabric can never dissolve
     over an unset first-room plane. On iOS the first room is already native and later
     rooms are mounted sequentially above; fetching those files into Blob URLs too would
     create a second competing owner. */
  var REST = MEDIA_PLAN.background;

  function paint(p) {
    barEl.style.transform = 'scaleX(' + p.ratio + ')';
    var pct = Math.round(p.ratio * 100);
    pctEl.textContent = (pct < 10 ? '0' : '') + pct;
    bytesEl.textContent = mb(p.loaded) + ' / ' + mb(p.total) + ' МБ';
    filesEl.textContent = p.files.filter(function (f) { return f.done; }).length +
                          ' / ' + p.files.length + ' файлів';
  }

  var loadStartedAt = performance.now();

  WardrobeLoader.load(REQUIRED, function (p) {
    paint(p);

    /* Prepare the decoded first track as soon as it lands, then make the single audible
       autoplay request exactly when the real aggregate loader reaches 50%. */
    var t0 = p.files.filter(function (f) { return f.url === TRACKS[0] && f.blobUrl; })[0];
    if (t0) {
      var blobs = {};
      p.files.forEach(function (f) { if (f.blobUrl) blobs[f.url] = f.blobUrl; });
      prepareScore(blobs, 'track-ready @ ' + Math.round(p.ratio * 100) + '%');
      requestScoreAtHalf(blobs, p.ratio);
    }
  }, { firstWave: FIRST_WAVE }).then(function (res) {
    if (res.unmeasurable.length) {
      /* Never let an unmeasured file hide inside a full-looking bar. */
      bytesEl.textContent += ' · без розміру: ' + res.unmeasurable.length;
    }

    /* Hand the downloaded bytes to the elements. Nothing is fetched twice. */
    function handOver(blobs) {
      document.querySelectorAll('video[data-src]').forEach(function (v) {
        var key = v.getAttribute('data-src');
        if (v.src) return;
        if (IOS_MEDIA) {
          /* Native iOS video must still wait for the loader to own THIS file. This is
             true for the textile intro; the room films are mounted by queueNextIOSRoom. */
          if (!hasLoadedBlob(blobs, key)) return;
          v.src = key;
          v.load();
          return;
        }
        if (blobs && blobs[key]) v.src = blobs[key];
      });
    }
    var introVideo = document.querySelector('[data-intro]');
    var filmEl = document.querySelector('[data-film]');
    if (introVideo && filmEl) {
      /* `loadeddata` can arrive before Safari has composited a frame.  Keep the
         poster until a seek/play has actually produced one; otherwise iPhone shows
         a black rectangle even though the element reports itself ready. */
      var revealIntroFrame = function () {
        filmEl.removeAttribute('data-intro-pending');
      };
      introVideo.addEventListener('seeked', revealIntroFrame, { once: true });
      introVideo.addEventListener('timeupdate', revealIntroFrame, { once: true });
      if (IOS_MEDIA) {
        introVideo.addEventListener('loadedmetadata', function () {
          introVideo.muted = true;
          introVideo.currentTime = Math.min(0.12, Math.max(0, introVideo.duration - 0.01));
          var prime = introVideo.play();
          if (prime && prime.then) {
            prime.then(function () {
              setTimeout(function () { introVideo.pause(); }, 120);
            }).catch(function () {});
          }
        }, { once: true });
      }
    }
    handOver(res.blobs);
    /* `loadeddata` is not accepted as visual proof on iOS: Safari can dispatch it
       before it paints. Request only after the source exists — otherwise WebKit may
       reject the callback registration before there is a media timeline. The two event
       fallbacks above retain support for older engines. */
    if (introVideo && typeof introVideo.requestVideoFrameCallback === 'function') {
      try { introVideo.requestVideoFrameCallback(revealIntroFrame); } catch (frameCallbackError) {}
    }

    /* THE REST OF THE FILM, UNDERNEATH A RUNNING JOURNEY.
     * Rooms two to four and the later tracks are fetched after the reveal, and each element
     * is handed its bytes the moment its own file lands.
     * The readout it writes to lives on the loader panel, which has already faded, so this
     * is diagnostics rather than something the viewer reads. What the VIEWER gets is the
     * seam hold: the engine will not enter a room whose film has not arrived, and says so
     * with data-gate="loading" instead of showing a blank frame.
     * Failures here are non-fatal by design: the first room already works. */
    window.rest = REST.length ? WardrobeLoader.load(REST, function (p) {
      var done = p.files.filter(function (f) { return f.done; }).length;
      bytesEl.textContent = 'решта фільму ' + mb(p.loaded) + ' / ' + mb(p.total) + ' МБ · ' +
                            done + '/' + p.files.length;
      var blobs = {};
      p.files.forEach(function (f) { if (f.blobUrl) blobs[f.url] = f.blobUrl; });
      handOver(blobs);
    }).then(function (r2) {
      handOver(r2.blobs);
      bytesEl.textContent = 'фільм у памʼяті · ' + mb(r2.bytes) + ' МБ';
      return r2;
    }).catch(function (err) {
      bytesEl.textContent = 'решта фільму не дозавантажилась: ' + err.message;
    }) : Promise.resolve({ blobs: {}, bytes: 0, unmeasurable: [], files: [] });

    /* Warm caches may jump directly from 0 to 100. They use the same threshold path,
       never a second mixer or a later reveal-time start. */
    prepareScore(res.blobs, 'after-load');
    requestScoreAtHalf(res.blobs, 1);
    window.journey = WardrobeJourney.create({
      /* The page downloaded everything itself, so the engine must not run a second
         preload nor repaint the bar. One owner for loading. */
      preloaded: true,
      inertia: 0.085,
      screensPerLeg: 3.4,   // four legs now, so a touch less scroll each
      motionTable: 'motion.json',   // measured; makes visual motion follow an exact sine

      /* THE INTRO, IN FRONT OF THE ROOMS.
       *
       * screens 1.8    the silk is 8 s of film; less scroll than a room because it has no
       *                station to arrive at and nothing to read on it.
       * handoverAt .94 from 94% of the intro's span the scroll starts ROOM ONE as well.
       *                The late handoff is deliberate: the second film must appear at its
       *                sofa-only opening, not after the rails and clothes have assembled.
       * fadeFrom  .98 the dissolve starts here. The .04 gap gives a readable fade while
       *                keeping room one's motion under 1.10s by the end of the intro
       *                (measured against this master's motion table), so the scarf hands
       *                off to a calm room with no rails or garments in frame. Re-check both
       *                numbers if the master swaps again — they are fitted to THIS table. */
      intro: { screens: 1.8, handoverAt: 0.94, fadeFrom: 0.98 },
      /* ROOM SEAMS ARE HARD CUTS, NOT DISSOLVES.
       *
       * The four generated masters are near-identical rooms but their endpoint pixels are
       * not registered: the outgoing last frame and incoming first frame differ by a mean
       * 2.5% (up to 5.6% of pixels over the visible threshold). A crossfade therefore makes
       * the two mirror frames ghost over one another. The intro keeps its intentional
       * textile fade; room-to-room transitions use the exact decoded endpoint instead. */
      seamWindow: 0,
      /* Blob-backed desktop rooms need only metadata: their bytes are already local.
         Native iOS rooms need an actual decoded frame before a preceding seam releases;
         otherwise a hidden video can report duration while its compositor is still black. */
      isFilmReady: function (_video, index) {
        return !IOS_MEDIA || iosRoomReady[index] === true;
      },
      onFrame: function (frame) {
        if (screenSurfaces) screenSurfaces.update(frame);
        if (pipelineDeck) pipelineDeck.onCameraFrame(frame);
      },
      onSpeed: function (s) { if (window.score) window.score.setSpeed(s); },
      /* ATTENTION without a hard gate.
       * dampFrom / dampMax: where the swipe starts going insensitive and how far it goes.
       * Capped at 0.94 rather than 1 so the film always still creeps — the viewer can feel
       * it resisting rather than think the page has broken.
       * stationAt: where the interface appears. */
      /* THE STOP SITS ON THE FRAME THE MIRRORS WERE MEASURED ON — owner decision.
       *
       * The rectangles above are measured off this version's FINAL frame. The stop was at
       * 0.92, and with forward travel closed the film settled around 0.84, which is about
       * 1.7 seconds of footage short of that frame: the camera is still translating, the
       * mirrors are still larger and further right, and the panel — correctly placed at
       * 5.0-44.0% of the film — therefore sat on the concrete to the left of the glass.
       * Measured on the running page: panel left edge 5.01% of the film, --ui-lag 0, no
       * transform. Nothing was misplaced; the stop was simply before the arrival.
       *
       * Exactly 1.0, not just near it. The lock is a CEILING — it refuses to let the page
       * past the pin but never pulls the viewer up to it, and pulling would break the rule
       * that nothing moves on the viewer's behalf. So the pin itself has to BE the measured
       * frame: a viewer travelling forward then stops on it, every time, with no assistance.
       * An earlier pin left the stop wherever the crawl happened to die (measured: 13.33s,
       * then 14.72-14.98s) and the single static rectangle cannot match a moving target.
       *
       * seamWindow (0) is not a reason to back off the boundary here: the exact endpoint
       * remains the calibrated stop, and a held gate is exactly what prevents an unfinished
       * mirror step from crossing it.
       * The desktop ramp keeps its old length (1.0 - 0.78 = 0.22, as 0.92 - 0.70 was),
       * so that approach feels unchanged; portrait gets its longer ramp below. dampMax
       * stays 0.94 because it is a ceiling, not a position. */
      /* TOUCH PORTRAIT GETS A WIDER CAPTURE WINDOW — the mirror is already fully visible
       * around 13.5s, but the old 0.93 latch only gave a phone about 0.77s of approach
       * before the calibrated 1.0 pin. Start damping at 0.46 and capture at 0.88 so the
       * attention plane has a deliberate reveal instead of flashing in at the last swipe.
       * The exact pin, desktop thresholds and the indefinite data gate remain unchanged. */
      dampFrom: MOBILE_PORTRAIT ? 0.46 : 0.78,
      dampMax: 0.94,
      stationAt: 1.0,
      /* TWO THRESHOLDS so the interface stops blinking. Mobile enters at 0.88, once both
         mirrors are visible, and still does not let go until progress falls back by the
         same wide dead band (0.28 on mobile / 0.18 on desktop). A hand resting near the
         station therefore cannot toggle it. */
      stationEnter: MOBILE_PORTRAIT ? 0.88 : 0.99,
      stationExit: MOBILE_PORTRAIT ? 0.60 : 0.81,
      /* FORWARD TRAVEL IS CLOSED UNTIL THE STEP HAS PRODUCED SOMETHING.
       *
       * There is nothing to travel to before a look exists — the next room shows a result,
       * so arriving there early would mean arriving at an empty one. The engine reports
       * this as data-gate="held", which deliberately has no CSS: no plate appears. The
       * reason is already on screen, in the mirror, as an unfinished step with its button
       * still waiting — which is a truer explanation than a banner would be.
       *
       * Asked lazily: ui.js is created after the journey, so this reads window.ui at call
       * time instead of capturing it. Before the interface exists nothing is gated, which
       * is correct — there is no step to be incomplete yet. */
      canAdvance: function (leg) {
        return window.ui ? window.ui.canAdvance(leg) : true;
      },
      legs: [
        { id: 0, name: 'диван → два дзеркала' },
        { id: 1, name: 'дзеркала → телевізор' },
        { id: 2, name: 'телевізор → ноутбук' },
        { id: 3, name: 'наїзд на монітор' }
      ]
    });

    screenSurfaces = window.WardrobeScreenSurfaces ? WardrobeScreenSurfaces.create({
      film: document.querySelector('[data-film]'),
      calibrationUrl: 'screen-calibration.json'
    }) : null;

    /* The pipeline is the exact same-origin HTML supplied in issue #2. It is fetched,
       SHA-checked and mounted into the measured laptop plane by the adapter; until that
       promise resolves the plane remains hidden, so a broken or stale document can never
       appear as an untracked white rectangle. The adapter owns the terminal reversible
       handoff, while the engine continues to own the cinematic camera before and after it. */
    var terminalCameraSettle = null;
    if (window.WardrobePipelineDeck && screenSurfaces) {
      pipelineDeck = WardrobePipelineDeck.create({
        surface: screenSurfaces,
        sourceUrl: 'zeely-pipeline-clients.html',
        /* A natural fling can cross the measured 14.145s stop in one browser frame.
         * The deck must not acquire the gesture or lock the projected laptop until this
         * promise has brought the one cinematic clock back to that exact measured frame.
         * This is a handoff, not a second scrolling scene. */
        onTerminalSettle: function (frame) {
          if (!frame || frame.leg !== 3 || !window.journey ||
              typeof window.journey.advanceToVideoTime !== 'function') return Promise.resolve('unavailable');
          var terminalSeconds = 14.145;
          if (Math.abs(Number(frame.videoTime) - terminalSeconds) <= 0.02) {
            return Promise.resolve('arrived');
          }
          if (terminalCameraSettle) return terminalCameraSettle;
          terminalCameraSettle = Promise.resolve(
            window.journey.advanceToVideoTime(3, terminalSeconds, { ease: 0.24 })
          ).catch(function () {
            return 'failed';
          }).then(function (outcome) {
            terminalCameraSettle = null;
            return outcome || 'arrived';
          });
          return terminalCameraSettle;
        }
      });
      pipelineDeck.ready.then(function () {
        if (screenSurfaces.mountLaptop(pipelineDeck.host)) {
          pipelineDeck.host.setAttribute('data-mounted', '1');
        }
      }).catch(function () {
        /* The adapter already renders a bounded error state in its own shadow tree. The
           measured laptop stays hidden because no unverified document is mounted. */
      });
    }

    window.ui = WardrobeUI.create({
      bridgePromise: productBridgePromise,
      /* The look landed, so the HOLD is over — the gate unlocks — but the page does not
         carry the viewer anywhere. This used to call releaseAndAdvance(), which drives the
         real scroll straight into leg 1 (the television) the instant a look exists, so the
         mirror's own action row (shoot / fashion video / new background / live) was never
         actually reachable in the normal flow — only by forcing position for testing. The
         owner caught this directly: the mirrors are where the actions live, so arriving at
         a look has to mean staying at the mirrors to use them, not being swept past them.
         refreshGate() re-checks canAdvance (now true) and lifts the hold so scrolling
         onward works the moment the viewer chooses to — nothing moves on their behalf. */
      onLookReady: function () {
        if (window.journey && window.journey.refreshGate) window.journey.refreshGate();
      },
      /* An action (shoot/fash/bg) started or finished working, or the live camera
       * started/stopped streaming — canAdvance's answer may just have changed, so the
       * gate needs to re-check itself. Same call as onLookReady; the trigger differs. */
      onGateChange: function () {
        if (window.journey && window.journey.refreshGate) window.journey.refreshGate();
      },
      onResult: function (result) {
        if (screenSurfaces) screenSurfaces.addResult(result);
      },
      /* A 16:9 result belongs on the television — carry the viewer there to see it
       * widescreen. A 9:16 result stays right here in the mirror, so this is never
       * called for it; nothing moves on its own. Reuses releaseAndAdvance() exactly as
       * onLookReady used to — that call site was removed this morning because it fired
       * too early (before the action row was even reachable), not because the primitive
       * itself was wrong. Here it fires only after the viewer has already used the
       * action row and chosen a widescreen result, so it does not reopen that problem. */
      onWideResult: function () {
        if (screenSurfaces) screenSurfaces.wakeTelevision();
      }
    });

    /* A persistent return to the selected saved-look library.  It does not create or
     * cancel anything: it first moves the presentation back to the physical mirror
     * station, then lets the UI expose the current library on that station.  Keeping this
     * in the chrome is especially important once a person has travelled on to TV/laptop —
     * the active look must remain reachable without reverse-scrolling through the film. */
    if (looksBtn) {
      looksBtn.disabled = false;
      looksBtn.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (window.ui && typeof window.ui.openLookLibrary === 'function') {
          window.ui.openLookLibrary();
        }
        if (window.journey && typeof window.journey.advanceTo === 'function') {
          var move = window.journey.advanceTo(0);
          if (move && typeof move.catch === 'function') move.catch(function () {});
        }
      });
    }

    /* HOW follows the cinematic clock only until the measured laptop stop at
     * 14.145s. Then wheel/touch belong to the verified document inside the
     * physical screen. The laptop never expands to a floating/fullscreen page.
     *
     * This is deliberately a two-part hand-off.  A programmatic move used to skip
     * the ordinary seam guard, so on a cold mobile device it could land on leg 3
     * before that film had a painted native frame.  The textile safety layer then
     * remained above the missing room and looked like HOW had teleported to the
     * wrong scene.  Wait for the exact target room first; only then begin the
     * normal inertial camera move. */
    var HOW_TARGET_LEG = 3;
    var HOW_TARGET_SECONDS = 14.145;
    var howTravelPending = false;

    function howTargetRoomReady() {
      var room = document.querySelector('video[data-leg="' + HOW_TARGET_LEG + '"]');
      var metadataReady = !!(room && room.src && room.duration > 0 && isFinite(room.duration));
      return metadataReady && (!IOS_MEDIA || iosRoomReady[HOW_TARGET_LEG] === true);
    }

    function waitForHowTargetRoom() {
      if (howTargetRoomReady()) return Promise.resolve(true);
      /* The iOS queue begins at boot and is deliberately sequential.  HOW waits for
       * that existing certificate instead of starting a second native prewarm. */
      return new Promise(function (resolve) {
        var checksLeft = 150; // 15 seconds at 100 ms; no unbounded invisible wait.
        function check() {
          if (howTargetRoomReady()) { resolve(true); return; }
          checksLeft -= 1;
          if (checksLeft <= 0) { resolve(false); return; }
          setTimeout(check, 100);
        }
        check();
      });
    }

    function clearHowReveal(laptop) {
      if (!laptop) return;
      laptop.removeAttribute('data-how-reveal');
      laptop.removeAttribute('data-how-visible');
    }

    function revealHowAtArrival(laptop, outcome) {
      /* A projection entering its calibration bounds is not enough: only the finished
       * camera move at the measured laptop stop may expose the document. */
      if (outcome !== 'arrived') { clearHowReveal(laptop); return outcome; }
      var state = window.journey && typeof window.journey.state === 'function'
        ? window.journey.state() : null;
      if (state && (state.leg !== HOW_TARGET_LEG || Number(state.videoTime) < HOW_TARGET_SECONDS - 0.10)) {
        clearHowReveal(laptop);
        return 'not-at-laptop';
      }
      if (laptop) laptop.setAttribute('data-how-visible', '1');
      return outcome;
    }

    if (howBtn) {
      howBtn.disabled = false;
      howBtn.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (howTravelPending) return;
        howTravelPending = true;
        howBtn.disabled = true;
        var laptop = document.querySelector('[data-laptop-surface]');
        /* A direct HOW request is a real navigation intent: on iPhone make its
           terminal clip the next single native prewarm instead of silently waiting
           behind all intervening rooms. */
        prioritizeIOSRoom(HOW_TARGET_LEG);
        waitForHowTargetRoom().then(function (ready) {
          if (!ready) { clearHowReveal(laptop); return 'target-room-unavailable'; }
          if (laptop) {
            laptop.setAttribute('data-how-reveal', '1');
            laptop.removeAttribute('data-how-visible');
          }
          if (pipelineDeck && typeof pipelineDeck.setProgress === 'function') {
            pipelineDeck.setProgress(0);
          }
          if (pipelineDeck && typeof pipelineDeck.requestScreenScroll === 'function') {
            pipelineDeck.requestScreenScroll();
          }
          if (window.journey && typeof window.journey.advanceToVideoTime === 'function') {
            return window.journey.advanceToVideoTime(HOW_TARGET_LEG, HOW_TARGET_SECONDS);
          }
          if (window.journey && typeof window.journey.advanceTo === 'function') {
            return window.journey.advanceTo(HOW_TARGET_LEG);
          }
          clearHowReveal(laptop);
          return 'journey-unavailable';
        }).then(function (outcome) {
          revealHowAtArrival(laptop, outcome);
        }, function () {
          clearHowReveal(laptop);
        }).then(function () {
          howTravelPending = false;
          howBtn.disabled = false;
        });
      });
    }

    /* The banner must say WHY the journey stopped. Its default sentence asks for media,
       which is the right sentence for a closed step gate and the wrong one for a room
       that is still arriving — so the text follows the state rather than sitting there
       being confidently wrong. */
    var gateText = document.querySelector('[data-gate-text]');
    var GATE_COPY = {
      loading: 'Готуємо наступну кімнату',
      closed:  'Завершіть цей крок, щоб іти далі'
    };
    function reflectGate() {
      var s = document.documentElement.getAttribute('data-gate');
      if (s && GATE_COPY[s] && gateText) gateText.textContent = GATE_COPY[s];
    }
    new MutationObserver(reflectGate)
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-gate'] });
    reflectGate();

    /* The gate owns media and generation. No adapter is handed in, so it runs as a
       declared placeholder and says so on screen. */

    /* No button. Everything is in memory, so the journey opens by itself — but not before
     * the loading screen has been on screen long enough to have been a moment.
     *
     * THE NUMBER IS NEVER FAKED. On a warm cache the whole 22 MB arrives in a few hundred
     * milliseconds and the pale field with the mark flashed and vanished, which is the
     * "loading disappears" the owner reported. So the REVEAL has a floor; the percentage
     * does not. The bar still reports real bytes the whole way and 100 still means every
     * byte arrived — it simply may sit at 100 for the remainder of the second before the
     * silk appears. A padded number would be a lie; a minimum curtain is staging. */
    var MIN_LOADER_MS = 1000;
    var waited = performance.now() - loadStartedAt;
    var hold = Math.max(0, MIN_LOADER_MS - waited);
    window.loaderHeldMs = Math.round(hold);
    setTimeout(function () { loaderEl.setAttribute('data-done', '1'); }, hold);

    /* `requestScoreAtHalf()` owns the one autoplay attempt. Keep the button truthful
       when an unexpectedly fast cache reached completion before its microtask ran. */
    reflectSoundState();

    soundBtn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (!window.score) return;
      /* This click is a real gesture, so it is also the moment a browser that refused
         autoplay will accept a resume. Unlocking here means the first press works even
         when the score was started under a suspended context. */
      var state = window.score.state();
      var waitingForPlayback = state.activeIndex >= 0 && state.paused[state.activeIndex];
      if (waitingForPlayback) {
        /* A blocked autoplay attempt is already silent even when the intended mute state
           is “on”. The first press must start sound, not toggle that intended state back
           to muted and leave the visitor in the same silent room. */
        window.score.setMuted(false);
        window.score.unlock();
        soundBtn.setAttribute('aria-pressed', 'true');
        soundBtn.textContent = 'звук';
        return;
      }
      window.score.unlock();
      var m = window.score.toggleMute();
      soundBtn.setAttribute('aria-pressed', String(!m));
      soundBtn.textContent = m ? 'без звуку' : 'звук';
    });
  }).catch(function (err) {
    /* A failed load must say so on the loader rather than hanging at 97 percent. */
    bytesEl.textContent = 'не завантажилось: ' + err.message;
  });
})();
</script>
</body>
</html>
