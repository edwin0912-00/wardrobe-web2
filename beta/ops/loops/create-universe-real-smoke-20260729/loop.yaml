version: 1
meta:
  name: create-universe-real-smoke-20260729
  description: Bounded real-provider proof of the standard background and Create Universe image routes.
  author: codex-main
  created: 2026-07-29

goal:
  statement: >
    Using one controlled non-personal full-look fixture, prove the real Higgsfield scene
    pipeline, first for one std.* background and then for one ready shoot.* Create Universe
    hero. Persist immutable job/QA receipts locally and report only identifiers, hashes and
    gate outcomes. Expand to one hero per remaining ready shoot only after both canaries pass.
  context_sources:
    - file: ./README.md
    - cmd: "git -C /Users/jarvis1/Documents/Codex/2026-07-28/zeely-codex-main-atelier status --short --branch"
      timeout_sec: 60
    - cmd: "node /Users/jarvis1/Documents/Codex/2026-07-28/zeely-codex-main-atelier/ops/runtime.mjs --verify"
      timeout_sec: 60
  definition_of_done: >
    A real provider receipt exists for the standard canary and the Create Universe canary;
    each is terminal with its exact QA result recorded. No mocked media, no raw personal
    media, and no more than ten Create Universe provider attempts are made.
  verification:
    - id: runtime-ready
      type: programmatic
      check: ["node", "ops/runtime.mjs", "--verify"]
      expect: exit_zero
      timeout_sec: 60
    - id: catalog-integrity
      type: programmatic
      check: ["node", "--test", "test/web/editorial-preview-api.test.js"]
      expect: exit_zero
      timeout_sec: 180
    - id: receipts-present
      type: programmatic
      check: ["node", "scripts/check-receipts.mjs", "loop-workspace"]
      expect: exit_zero
      timeout_sec: 60

host:
  cli: codex
  model: default
  invoke: ["codex", "exec"]
  timeout_sec: 900

council: []
gates:
  plan_gate:
    when: after_plan
    members: []
    verdict_policy: fixed_passes
    criteria: [runtime-ready]
    max_revisions: 1
  delivery_gate:
    when: after_each_delivery
    members: []
    verdict_policy: fixed_passes
    criteria: [runtime-ready, catalog-integrity, receipts-present]
    max_revisions: 1

loop_control:
  max_iterations: 12
  budget:
    wall_clock_min: 90
  no_progress:
    max_stalled_iterations: 2
    signals:
      - same provider or authentication blocker repeats without a changed receipt
      - the same mode fails QA twice without a new typed defect
    action: stop
  human_checkpoints: []
  stop_conditions:
    - both canaries have terminal receipts and the planned expansion is complete
    - max_iterations reached
    - same blocker repeats for 2 iterations
    - wall clock cap exceeded

execution:
  mode: in_session
  isolation: current_workspace
  side_effects:
    requires_approval: true
    duplicate_action_check: true
    notes: >
      Explicit user approval authorizes these bounded paid Higgsfield calls. The fixture is
      controlled test media. Never submit user uploads, secrets, or raw prompts to a judge.

observability:
  state_file: state.json
  run_log: run-log.md
  checkpoint_granularity: gate

privacy:
  egress: []

workspace:
  dir: ./loop-workspace
  layout:
    - smoke-plan.md
    - run-log.md
    - state.json
    - receipts/
    - smoke-report.md
